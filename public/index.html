<!DOCTYPE html>
<!-- Brand Mirror v4.2 – Glow getauscht, dunkle Button-Schrift, Konfetti + Ladeanimation -->
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brand Mirror · Frischmuth.Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,500;0,600;0,700;1,700&family=Archivo+Black&family=Outfit:wght@700&family=Cinzel:wght@700&family=Libre+Baskerville:wght@700&family=Source+Serif+4:wght@700&family=Oswald:wght@700&family=Playfair+Display:ital@1&family=Nunito:wght@600&family=Unbounded:wght@700&family=Inter:wght@500&family=Quicksand:wght@500&family=DM+Serif+Display&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --night:#0D0B14;--orange:#FF5C00;--cream:#F8F4EE;--white:#FFFFFF;
  --text:#0D0B14;--muted:#5A5550;--soft:#8A837B;--line:#D0D0D0;--line2:#D8D0C4;
  --on-dark:#F8F4EE;--on-dark-muted:#C8C2BA;
}
body{font-family:'Jost',sans-serif;background:#111;min-height:100vh;color:var(--text);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none;border:none;background:none;color:inherit}
input{font-family:inherit}
.app{width:100%;max-width:430px;margin:0 auto;min-height:100vh;background:var(--cream);position:relative;overflow-x:hidden}
.slide{min-height:100vh;display:flex;flex-direction:column;padding:0 24px 24px;animation:sIn .3s ease}
.slide.dark{background:var(--night);color:var(--on-dark)}
@keyframes sIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.topbar{height:5px;margin:0 -24px;background:var(--night)}
.topbar.orange{background:var(--orange)}
.spacer{flex:1}

/* Fortschritt */
.progress{margin-top:18px;height:3px;border-radius:2px;background:#E8E8E8;overflow:hidden}
.progress span{display:block;height:100%;background:var(--orange);border-radius:2px;transition:width .3s ease}
.step{font-size:11px;color:var(--muted);margin-top:7px}

/* Typo */
.h-q{font-weight:700;font-size:26px;line-height:1.18;letter-spacing:-.5px;margin-top:30px}
.sub{font-size:14px;color:var(--muted);margin-top:14px;line-height:1.45}
.h-italic{font-weight:700;font-style:italic;text-transform:uppercase;letter-spacing:-.5px;line-height:1.08}
.label{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#737373}
.accent-line{width:48px;height:3px;border-radius:2px;background:var(--orange)}

/* Start */
.logo{height:31px;margin-top:32px;align-self:flex-start}
.start-h{font-size:44px;margin-top:40px;color:var(--on-dark)}
.start-meta{font-size:16px;color:#C8C2BA;margin-top:18px}
.start-p{font-size:15px;color:#B8B0A8;margin-top:10px;line-height:1.45}
.btn-primary{display:flex;align-items:center;justify-content:center;width:100%;height:62px;border-radius:14px;background:var(--orange);color:var(--night);font-size:17px;font-weight:600;transition:transform .15s ease,box-shadow .15s ease;text-decoration:none}
.btn-primary:active{transform:scale(.98)}
.btn-primary:hover{box-shadow:0 10px 30px rgba(255,92,0,.35)}
.start-foot{font-size:12px;color:#77706A;margin-top:18px}

/* Antworten */
.answers{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.answer{display:flex;align-items:center;gap:12px;width:100%;min-height:74px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--cream);text-align:left;transition:background .15s ease,border-color .15s ease,color .15s ease}
.answer .letter{flex:0 0 32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text)}
.answer .txt{font-size:14px;font-weight:600;line-height:1.4;color:#444}
.answer:hover{border-color:#B8B0A8}
.answer.selected{background:var(--night);border-color:var(--night)}
.answer.selected .letter{color:#fff}
.answer.selected .txt{color:var(--cream)}

/* Zurück */
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding:8px 0;margin-top:24px;align-self:flex-start}
.back svg{width:14px;height:12px;stroke:var(--muted);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.slide.dark .back{color:#B8B0A8}
.slide.dark .back svg{stroke:#B8B0A8}

/* E-Mail */
.email-h{font-size:40px;margin-top:56px}
.field{width:100%;height:56px;border-radius:14px;border:1.5px solid var(--line2);background:#fff;padding:0 16px;font-size:15px;color:var(--text)}
.field::placeholder{color:#B8B0A8}
.field:focus{outline:none;border-color:var(--orange)}
.err{font-size:12px;color:#B21A1A;margin-top:6px;display:none}
.privacy{font-size:12px;color:var(--soft);margin-top:12px;line-height:1.45;text-align:center}
.code-row{display:flex;gap:8px;margin-top:10px}
.code-row .field{height:48px;background:#EFEAE2;border-color:#EFEAE2;font-size:14px}
.btn-code{flex:0 0 48px;height:48px;border-radius:14px;background:var(--night);color:#fff;font-size:18px}

/* Validierung */
.reveal{background:var(--night);border-radius:18px;padding:24px;margin-top:20px;color:var(--on-dark)}
.reveal .rl{font-size:10px;font-weight:500;letter-spacing:1px;color:var(--on-dark-muted)}
.reveal .big{font-size:40px;color:#fff;margin-top:10px}
.reveal .bar{width:56px;height:3px;border-radius:2px;background:var(--orange);margin-top:10px}
.reveal p{font-size:13px;line-height:1.48;color:var(--on-dark-muted);margin-top:16px}
.val-q{font-size:22px;margin-top:32px}
.vbtns{display:flex;flex-direction:column;gap:16px;margin-top:20px}
.vbtn{display:flex;align-items:center;justify-content:center;gap:8px;height:56px;border-radius:14px;border:1.5px solid var(--line2);background:#fff;font-size:15px;font-weight:500;color:var(--text);transition:background .15s ease,color .15s ease}
.vbtn .ic{font-weight:700}
.vbtn.selected{background:var(--night);border-color:var(--night);color:var(--cream)}
.link{font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;margin-top:20px;align-self:flex-start}

/* Ergebnis R1 */
.res-card{border-radius:18px;padding:24px;margin-top:16px;color:#fff}
.res-card .rl{font-size:10px;font-weight:600;letter-spacing:1px;color:#999}
.res-card .name{font-size:44px;margin-top:10px}
.res-card.second{background:#2E2E36}
.res-card.second .name{font-size:28px;color:#F2F2F5}
.res-card.second .rl{color:#9A9AA3}
.res-card .pct{font-size:28px;font-weight:700;margin-top:8px}
.res-card.second .pct{font-size:20px}
.track{height:8px;border-radius:4px;background:#404047;margin-top:10px;overflow:hidden}
.res-card.second .track{height:6px;background:#4A4A55}
.track span{display:block;height:100%;border-radius:4px}
.res-card .note{font-size:11px;color:#BFBFC6;margin-top:10px}
.how-h{font-size:13px;font-weight:600;margin-top:28px}
.how-p{font-size:12px;color:#737373;line-height:1.5;margin-top:8px}

/* Typ-Karte */
.tc-name{font-size:44px;margin-top:6px}
.tc-narr{font-size:16px;line-height:1.5;margin-top:12px}
.sec{margin-top:22px}
.sec .label{margin-bottom:10px}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sw .chip{height:62px;border-radius:10px;border:1px solid rgba(0,0,0,.08)}
.sw b{display:block;font-size:11px;font-weight:600;margin-top:8px}
.sw span{display:block;font-size:10px;color:#737373;line-height:1.45}
.preview{border-radius:14px;padding:16px 20px}
.preview .aa{font-size:30px;line-height:1.15}
.preview .pbar{width:48px;height:3px;border-radius:2px;margin-top:10px}
.preview .plab{font-size:11px;margin-top:10px}
.body13{font-size:13px;line-height:1.5}
.kunden{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.k-item{border-left:2px solid var(--night);padding-left:8px;margin-top:8px}
.k-item.anti{border-left-color:#B91C1C}
.k-item b{display:block;font-size:11px;font-weight:700;text-transform:uppercase}
.k-item span{display:block;font-size:11px;color:#555;line-height:1.4;margin-top:2px}
.anti-label{color:#B91C1C}
.cta-h{font-size:18px;margin-top:30px}
.small-links{display:flex;justify-content:center;gap:18px;margin-top:16px}
.small-links button{font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}


/* ── Glow (lila oben rechts, orange unten links) ── */
.glow{position:relative;overflow:hidden}
.glow::before{content:'';position:absolute;top:-60px;right:-60px;width:280px;height:280px;background:radial-gradient(circle,rgba(255,92,0,.32) 0%,transparent 70%);border-radius:50%;pointer-events:none}
.glow::after{content:'';position:absolute;bottom:-60px;left:-60px;width:300px;height:300px;background:radial-gradient(circle,rgba(91,63,160,.5) 0%,transparent 70%);border-radius:50%;pointer-events:none}
.glow > *{position:relative;z-index:1}

/* Start (wie v3.3) */
.s-logo{height:28px;margin-top:32px;align-self:flex-start}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--orange);margin-top:44px}
.s-h1{font-size:52px;font-weight:700;font-style:italic;text-transform:uppercase;line-height:1.1;letter-spacing:-1.5px;color:#fff;flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 0}
.s-h1 span{color:var(--orange)}
.s-divider{width:40px;height:3px;background:var(--orange);margin:0 0 18px}
.s-p{font-size:15px;color:#E8E4DE;line-height:1.55;margin-bottom:8px}
.s-p.accent{color:var(--orange);font-weight:500;margin-bottom:28px}
.btn-glow{display:flex;align-items:center;justify-content:center;width:100%;padding:18px;border-radius:12px;background:var(--orange);color:var(--night);font-size:16px;font-weight:700;position:relative;box-shadow:0 4px 20px rgba(255,92,0,.35);transition:opacity .2s,transform .15s}
.btn-glow:hover{opacity:.92;transform:translateY(-1px)}
.btn-glow:active{transform:scale(.98)}
.btn-grad{background:linear-gradient(135deg,#FF5C00 0%,#FF8C00 45%,#B79CFF 100%);background-size:200% 200%;overflow:hidden;animation:gradMove 5s ease infinite,glowPulse 2.6s ease-in-out infinite}
@keyframes gradMove{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes glowPulse{0%,100%{box-shadow:0 4px 20px rgba(255,92,0,.35)}50%{box-shadow:0 6px 32px rgba(183,156,255,.55)}}
.btn-grad::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 3s ease-in-out infinite}
@keyframes shine{0%{left:-100%}55%,100%{left:100%}}
.btn-grad .arr{display:inline-block;margin-left:6px}
.btn-grad.firing .arr{animation:arrowFly .5s cubic-bezier(.25,.46,.45,.94) forwards}
@keyframes arrowFly{0%{transform:translateX(0);opacity:1}60%{transform:translateX(24px);opacity:0}61%{transform:translateX(-20px);opacity:0}100%{transform:translateX(0);opacity:1}}
@media (prefers-reduced-motion:reduce){.btn-grad,.btn-grad::before{animation:none}}
.s-foot{text-align:center;font-size:11px;color:rgba(255,255,255,.3);margin-top:14px;letter-spacing:1px;line-height:1.7}

/* E-Mail dunkel (wie v3.3) */
.e-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 4px}
.e-icon{font-size:44px;margin-bottom:20px}
.e-h{font-size:32px;font-weight:700;font-style:italic;text-transform:uppercase;color:#fff;text-align:center;line-height:1.15;letter-spacing:-1px;margin-bottom:12px}
.e-sub{font-size:15px;color:#B8B0A8;text-align:center;line-height:1.65;margin-bottom:32px}
.e-sub span{color:var(--orange);font-weight:500}
.e-input{width:100%;padding:18px 20px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);border-radius:12px;font-size:16px;color:#fff;outline:none;transition:border-color .2s;margin-bottom:12px}
.e-input::placeholder{color:rgba(255,255,255,.3)}
.e-input:focus{border-color:var(--orange)}
.e-err{font-size:13px;color:#FF6B6B;margin:-4px 0 12px;text-align:center;display:none}
.e-or{display:flex;align-items:center;gap:12px;margin:22px 0 16px;width:100%}
.e-or::before,.e-or::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.1)}
.e-or span{font-size:12px;color:rgba(255,255,255,.3);letter-spacing:1px;text-transform:uppercase}
.e-code-label{font-size:13px;color:rgba(255,255,255,.4);margin-bottom:10px;text-align:center}
.e-code-row{display:flex;gap:8px;width:100%}
.e-code{flex:1;padding:14px 16px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);border-radius:10px;font-size:14px;color:#fff;outline:none;letter-spacing:1px}
.e-code::placeholder{color:rgba(255,255,255,.2)}
.e-code:focus{border-color:#5B3FA0}
.e-code-btn{width:48px;height:48px;flex-shrink:0;background:rgba(91,63,160,.4);border:1.5px solid rgba(91,63,160,.5);border-radius:10px;color:#fff;font-size:18px;transition:all .2s}
.e-code-btn:hover{background:#5B3FA0;border-color:#5B3FA0}
.e-privacy{font-size:11px;color:rgba(255,255,255,.3);text-align:center;margin-top:20px;line-height:1.6}

/* Validierung neu */
.reveal.glow::before{top:-40px;right:-40px;width:180px;height:180px;background:radial-gradient(circle,rgba(91,63,160,.4) 0%,transparent 70%)}
.reveal.glow::after{bottom:-30px;left:-30px;width:140px;height:140px;background:radial-gradient(circle,rgba(255,92,0,.2) 0%,transparent 70%)}
.reveal .who{font-size:23px;font-weight:600;line-height:1.35;color:#fff;margin-top:14px}

/* Konfetti */
#spark-overlay{position:fixed;inset:0;z-index:9999;pointer-events:none;display:none;overflow:hidden}
.spark{position:absolute;border-radius:50%;animation:sparkFly var(--dur) ease-out forwards}
@keyframes sparkFly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}}
/* Ladeanimation */
.load{align-items:center;justify-content:center;gap:32px}
.orbit{position:relative;width:120px;height:120px}
.orbit-ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid transparent;animation:orbitSpin var(--spd) linear infinite}
.orbit-ring:nth-child(1){border-top-color:var(--orange);border-right-color:rgba(255,92,0,.3);--spd:1.8s}
.orbit-ring:nth-child(2){border-top-color:#7C5CD6;border-left-color:rgba(91,63,160,.3);--spd:2.8s;inset:16px;animation-direction:reverse}
.orbit-ring:nth-child(3){border-bottom-color:rgba(255,255,255,.2);--spd:4s;inset:32px}
.orbit-dot{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--orange);top:50%;left:50%;transform:translate(-50%,-50%);animation:orbitPulse 1.2s ease-in-out infinite}
@keyframes orbitSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes orbitPulse{0%,100%{transform:translate(-50%,-50%) scale(1);box-shadow:0 0 0 0 rgba(255,92,0,.4)}50%{transform:translate(-50%,-50%) scale(1.5);box-shadow:0 0 0 8px rgba(255,92,0,0)}}
.load-label{font-size:13px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:#B8B0A8;text-align:center}
.dots{display:flex;gap:8px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--orange);animation:dp 1.4s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dp{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1.2)}}

@media (min-width:431px){.app{box-shadow:0 0 60px rgba(0,0,0,.4)}}
</style>
</head>
<body>
<div id="spark-overlay"></div>
<div class="app" id="app"></div>

/* ───────── Zustand ───────── */
var state;
function resetState(){
  state = {screen:'start', qi:0, answers:[], scores:null, tie:null, tieChoice:null,
           main:null, second:null, pctMain:0, pctSecond:0, override:false, email:null, valChoice:null};
}
resetState();

function emptyScores(){ var s={}; TYPES.forEach(function(t){s[t]=0;}); return s; }
function baseScores(){ var s=emptyScores(); state.answers.forEach(function(t){ s[t]+=1; }); return s; }
function ranked(s){
  // stabil: bei Gleichstand gilt die Reihenfolge in TYPES
  return TYPES.slice().sort(function(a,b){ return (s[b]-s[a]) || (TYPES.indexOf(a)-TYPES.indexOf(b)); });
}
function shuffle(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;} return a; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function cap(t){ return t.charAt(0)+t.slice(1).toLowerCase(); }

/* Nach Frage 12: knapp? → Zusatzfrage, sonst Ergebnis berechnen */
function afterQuestions(){
  var s = baseScores();
  var r = ranked(s);
  var top = s[r[0]];
  var close = r.filter(function(t){ return s[t] >= top-1; });
  // Mehr als 4 Typen dicht vorn: nur die punktgleichen Spitzenreiter kommen in die Zusatzfrage.
  // Liegt ein Typ allein vorn, gewinnt er ohne Zusatzfrage.
  if(close.length > 4){
    close = r.filter(function(t){ return s[t] === top; });
  }
  state.scores = s;
  if(close.length >= 2){
    state.tie = shuffle(close);
    state.screen = 'tie';
  } else {
    state.tie = null;
    finalize();
    state.screen = 'email';
  }
  render();
}
function finalize(){
  var s = baseScores();
  if(state.tie && state.tieChoice){ s[state.tieChoice] += 2; }
  state.scores = s;
  var r = ranked(s);
  state.main = r[0];
  state.second = r[1];
  var a = s[r[0]], b = s[r[1]];
  state.pctMain = (a+b) > 0 ? Math.round(100*a/(a+b)) : 100;
  state.pctSecond = 100 - state.pctMain;
  state.override = false;
}

/* ───────── Render ───────── */
function render(){
  if(document.activeElement && document.activeElement.blur){ document.activeElement.blur(); }
  var app = document.getElementById('app');
  var map = {start:renderStart, question:renderQuestion, tie:renderTie, email:renderEmail,
             validation:renderValidation, loading:renderLoading, alt:renderAlt, result:renderResult, card:renderCard};
  app.innerHTML = map[state.screen]();
  window.scrollTo(0,0);
}

    '<div class="orbit"><div class="orbit-ring"></div><div class="orbit-ring"></div><div class="orbit-ring"></div><div class="orbit-dot"></div></div>' +
    '<div class="load-label">Dein Profil wird erstellt</div>' +
    '<div class="dots"><i></i><i></i><i></i></div>' +
  '</div>';
}

function launchSparks(){
  var overlay = document.getElementById('spark-overlay');
  if(!overlay){ return; }
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){ return; }
  overlay.style.display = 'block';
  overlay.innerHTML = '';
  var colors = ['#FF5C00','#FFB347','#FFD700','#FF6B6B','#A78BFA','#60A5FA','#FBBF24','#34D399'];
  var app = document.getElementById('app');
  var rect = app.getBoundingClientRect();
  var cx = rect.left + rect.width/2, cy = window.innerHeight/2;
  for(var i=0;i<80;i++){
    var el = document.createElement('div');
    el.className = 'spark';
    var angle = Math.random()*Math.PI*2, dist = 80 + Math.random()*300;
    var size = 4 + Math.random()*10, dur = 0.6 + Math.random()*0.8;
    el.style.cssText = 'left:'+(cx+Math.random()*60-30)+'px;top:'+(cy+Math.random()*60-30)+'px;width:'+size+'px;height:'+size+'px;background:'+colors[Math.floor(Math.random()*colors.length)]+';--tx:'+(Math.cos(angle)*dist)+'px;--ty:'+(Math.sin(angle)*dist)+'px;--dur:'+dur+'s;animation-delay:'+(Math.random()*0.3)+'s';
    overlay.appendChild(el);
  }
  setTimeout(function(){ overlay.style.display='none'; overlay.innerHTML=''; },1600);
}

function toValidationWithShow(){
  var btn = document.getElementById('emailBtn');
  if(btn){ btn.classList.add('firing'); }
  launchSparks();
  setTimeout(function(){
    state.screen='loading'; render();
    setTimeout(function(){ state.screen='validation'; render(); }, 1800);
  }, 450);
}

function altTypes(){
  var r = ranked(state.scores);
  return r.filter(function(t){ return t !== state.main; }).slice(0,3);
}
function renderAlt(){
  return '<div class="slide">' +
    '<div class="progress"><span style="width:100%"></span></div>' +
    '<div class="step">Deine Alternativen</div>' +
    '<h2 class="h-q">Welche Beschreibung passt besser zu dir?</h2>' +
    '<p class="sub">Diese Typen liegen bei dir ebenfalls weit vorn.</p>' +
    answerList(altTypes().map(function(t){return CORE[t];}), 'pickAlt') +
    '<button class="link" onclick="toResult()">Doch mein erstes Ergebnis</button>' +
    '<div class="spacer"></div>' +
    backBtn('goBack') +
  '</div>';
}

  var m = PROFILE[state.main], s = PROFILE[state.second];
  return '<div class="slide">' +
    '<div class="topbar"></div>' +
    '<div class="label" style="margin-top:34px">Dein Ergebnis</div>' +
    '<p style="font-size:14px;margin-top:12px">Deine Antworten gewichten so:</p>' +
    '<div class="res-card" style="background:var(--night);margin-top:24px">' +
      '<div class="rl">DEIN HAUPTTYP</div>' +
      '<div class="h-italic name">'+state.main+'</div>' +
      '<div class="pct" style="color:'+m.th[2]+'">'+state.pctMain+' %</div>' +
      '<div class="track"><span style="width:'+state.pctMain+'%;background:'+m.th[2]+'"></span></div>' +
      '<div class="note">Auf diesen Typ baut dein Branding auf.</div>' +
    '</div>' +
    '<div class="res-card second">' +

    '<button class="btn-primary" style="margin-top:32px" onclick="toCard()">Mein Branding ansehen →</button>' +
    '<div class="spacer"></div>' +

    '<div class="sec"><div class="label">Deine Farbpalette</div><div class="swatches">' +
      p.pal.map(function(c){
        return '<div class="sw"><div class="chip" style="background:'+c[1]+'"></div><b>'+esc(c[0])+'</b><span>'+c[1]+'</span><span>'+c[2]+'</span></div>';
      }).join('') +
    '</div></div>' +
    '<div class="sec"><div class="label">Typografie</div>' +
      '<div class="preview" style="background:'+p.th[0]+';color:'+p.th[1]+'">' +
        '<div class="aa" style="'+fontCss+'">Aa Bb Cc 123</div>' +

        '<div class="plab" style="color:'+p.th[2]+'">Schriftvorschlag: '+esc(f[3])+'</div>' +
      '</div></div>' +
    '<div class="sec"><div class="label">Bildsprache</div><p class="body13">'+esc(p.bild)+'</p></div>' +
    '<div class="sec"><div class="label">Ton</div><p class="body13">'+esc(p.ton)+'</p></div>' +
    '<div class="sec kunden">' +
      '<div><div class="label">Traumkunden</div>' + p.tk.map(function(k){return '<div class="k-item"><b>'+esc(k[0])+'</b><span>'+esc(k[1])+'</span></div>';}).join('') + '</div>' +
      '<div><div class="label anti-label">Anti-Kunden</div>' + p.ak.map(function(k){return '<div class="k-item anti"><b>'+esc(k[0])+'</b><span>'+esc(k[1])+'</span></div>';}).join('') + '</div>' +
    '</div>' +
    '<h2 class="h-italic cta-h">Lass uns dein Branding aufbauen</h2>' +

/* ───────── Aktionen ───────── */
function startQuiz(){ resetState(); state.screen='question'; render(); }

function flash(el, cb){
  if(el){ el.classList.add('selected'); }
  setTimeout(cb, 220);
}
function pickAnswer(i, el){
  flash(el, function(){
    state.answers[state.qi] = QUESTIONS[state.qi].a[i][1];
    state.answers.length = state.qi+1;
    if(state.qi < QUESTIONS.length-1){ state.qi++; state.screen='question'; render(); }
    else { afterQuestions(); }
  });
}
function pickTie(i, el){
  flash(el, function(){ state.tieChoice = state.tie[i]; finalize(); state.screen='email'; render(); });
}
function validateYes(el){ flash(el, function(){ state.screen='result'; render(); }); }
function validateNo(el){ flash(el, function(){ state.screen='alt'; render(); }); }
function pickAlt(i, el){
  var t = altTypes()[i];
  flash(el, function(){
    state.main = t; state.override = true;
    if(state.email){ saveEmailToBrevo(state.email); }
    state.screen='card'; render();
  });
}
function toResult(){ finalize(); state.screen='result'; render(); }
function toCard(){ state.screen='card'; render(); }
function restart(){ resetState(); render(); }

function goBack(){
  var s = state.screen;
  if(s==='question'){
    if(state.qi===0){ state.screen='start'; }
    else { state.qi--; }
  } else if(s==='tie'){ state.qi=11; state.screen='question'; }
  else if(s==='email'){ if(state.tie){ state.screen='tie'; } else { state.qi=11; state.screen='question'; } }
  else if(s==='validation'){ state.screen='email'; }
  else if(s==='alt'){ state.screen='validation'; }
  else if(s==='result'){ state.screen='validation'; }
  render();
}

function submitEmail(){
  var input = document.getElementById('emailInput');
  var email = input.value.trim();
  var ok = email.length <= 254 && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  document.getElementById('emailError').style.display = ok ? 'none' : 'block';
  if(!ok){ return; }
  state.email = email;
  saveEmailToBrevo(email);
  toValidationWithShow();
}
function submitCode(){
  var code = document.getElementById('codeInput').value.trim().toLowerCase();
  var ok = code === 'fun2take';
  document.getElementById('codeError').style.display = ok ? 'none' : 'block';
  if(ok){ toValidationWithShow(); }
}

async function saveEmailToBrevo(email){
  try{
    await fetch('/api/subscribe',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:email,archetype:state.main})
    });
  }catch(e){
    console.log('Brevo error:',e);
  }
}

function downloadAsImage(btn){
  var el = document.getElementById('card');
  if(!el || typeof html2canvas === 'undefined'){ return; }
  var old = btn.textContent;
  btn.textContent = 'Wird erstellt …'; btn.disabled = true;
  html2canvas(el, {backgroundColor:'#F8F4EE', scale:2, useCORS:true, logging:false}).then(function(canvas){
    var a = document.createElement('a');
    a.download = 'BrandMirror-' + state.main + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
    btn.textContent = old; btn.disabled = false;
  }).catch(function(){
    btn.textContent = 'Fehler – bitte nochmal versuchen'; btn.disabled = false;
  });
}

render();
